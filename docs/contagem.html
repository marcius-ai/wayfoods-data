<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Contagem de Estoque — Way Foods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --verde:#002d02; --verde2:#1a4a1a; --verm:#bf0417; --laranja:#f2a413;
    --bg:#f5f0e8; --card:#fff; --borda:#e8e2d9; --txt:#1a1a1a; --sub:#6b6560;
    --radius:14px; --maxw:560px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:'DM Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{padding-bottom:96px}

  header{position:sticky;top:0;z-index:20;background:var(--verde);padding:10px 12px 10px}
  header>.brand,header>.meta,header>.tabs,header>.search{max-width:var(--maxw);margin-left:auto;margin-right:auto}
  .brand{display:flex;align-items:center;gap:10px}
  .brand img{width:40px;height:40px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--laranja)}
  .brand .tit{font-weight:700;font-size:15px;color:#fff;line-height:1.15}
  .brand .sub{font-size:11px;color:var(--laranja);font-weight:600}
  .meta{display:flex;gap:6px;margin-top:10px}
  .meta label{flex:1 1 0;min-width:0;font-size:10px;color:rgba(255,255,255,.6);display:flex;flex-direction:column;gap:2px}
  .meta select,.meta input{background:var(--card);color:var(--txt);border:1px solid var(--borda);
    border-radius:8px;padding:6px 6px;font-size:13px;width:100%;font-family:inherit;min-width:0}
  .meta input[type=date]{font-size:12px;padding:6px 4px}

  .tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .tab{flex:1 0 auto;text-align:center;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.18);font-size:13px;font-weight:600;color:rgba(255,255,255,.72);white-space:nowrap}
  .tab.active{background:var(--laranja);color:#3a2600;border-color:var(--laranja)}
  .tab .n{display:block;font-size:11px;font-weight:500;opacity:.85;margin-top:1px}

  .search{margin-top:8px}
  .search input{width:100%;background:var(--card);border:1px solid var(--borda);color:var(--txt);
    border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit}

  main{padding:12px;max-width:var(--maxw);margin:0 auto}
  .group{margin-bottom:10px;border:1px solid var(--borda);border-radius:var(--radius);overflow:hidden;background:var(--card)}
  .group>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;justify-content:space-between;
    align-items:center;font-weight:700;font-size:12px;color:var(--verde);background:#faf7f1;
    text-transform:uppercase;letter-spacing:.4px}
  .group>summary::-webkit-details-marker{display:none}
  .group>summary .badge{font-size:11px;color:var(--sub);font-weight:600;text-transform:none;letter-spacing:0}
  .group>summary .badge b{color:var(--verde2)}

  .item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--borda)}
  .item .info{flex:1;min-width:0}
  .item .nome{font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
  .item .sub{font-size:11px;color:var(--sub);margin-top:2px}
  .item.filled{background:#eef6ee}

  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{width:34px;height:38px;border-radius:9px;border:1px solid var(--borda);
    background:#faf7f1;color:var(--verde);font-size:20px;line-height:1;font-weight:700}
  .stepper button:active{background:var(--verde);color:#fff;border-color:var(--verde)}
  .qty{width:58px;height:38px;text-align:center;background:#fff;border:1px solid var(--borda);
    color:var(--verde);border-radius:9px;font-size:15px;font-weight:700;font-family:inherit}
  .qty:focus{outline:2px solid var(--laranja)}
  .unit{font-size:11px;color:var(--sub);width:26px;text-align:left}

  footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--borda);
    padding:10px 12px;display:flex;justify-content:center}
  .footwrap{display:flex;gap:10px;align-items:center;width:100%;max-width:var(--maxw)}
  footer .stat{flex:1;font-size:12px;color:var(--sub)}
  footer .stat b{color:var(--txt)}
  .btn{padding:12px 18px;border-radius:11px;border:none;font-size:15px;font-weight:700;background:var(--verm);color:#fff;font-family:inherit}
  .btn:disabled{opacity:.35}
  .syncrow{display:flex;align-items:center;gap:10px;padding:8px 12px 0}
  .btn2{padding:10px 14px;border-radius:10px;border:1px solid var(--borda);background:var(--card);
        color:var(--txt);font-size:14px;font-weight:700;font-family:inherit;white-space:nowrap}
  .btn2:disabled{opacity:.5}
  .syncmsg{font-size:12px;color:var(--sub);line-height:1.3}

  .loading,.error{padding:40px 16px;text-align:center;color:var(--sub)}
  .error{color:var(--verm)}

  /* modal preview */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:50}
  .modal.show{display:flex}
  .sheet{background:var(--card);width:100%;max-height:80vh;border-radius:18px 18px 0 0;padding:16px;overflow:auto}
  .sheet h3{margin:0 0 6px;color:var(--verde)}
  .sheet pre{background:#faf7f1;border:1px solid var(--borda);border-radius:10px;padding:12px;
    font-size:11px;overflow:auto;color:#333;white-space:pre-wrap;word-break:break-word}
  .sheet .close{margin-top:12px;width:100%;background:var(--verde);color:#fff}
  .saved-pill{font-size:11px;color:var(--verde2)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="logo.jpg" alt="Way Foods">
    <div>
      <div class="tit">Contagem de Estoque</div>
      <div class="sub">WAY FOODS</div>
    </div>
  </div>
  <div class="meta">
    <label class="loja">Loja
      <select id="loja">
        <option>Suzano</option>
        <option>São José dos Campos</option>
      </select>
    </label>
    <label>Data
      <input type="date" id="data">
    </label>
    <label>Tipo
      <select id="tipo">
        <option value="insumo">Insumos</option>
        <option value="preparo">Preparos</option>
      </select>
    </label>
  </div>
  <div class="syncrow">
    <button class="btn2" id="btnSync">🔄 Atualizar catálogo</button>
    <div class="syncmsg" id="syncMsg">Clique antes de começar a contagem.</div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="search"><input id="busca" placeholder="Buscar item..." inputmode="search"></div>
</header>

<main id="app"><div class="loading">Carregando itens do GitHub…</div></main>

<footer>
  <div class="footwrap">
    <div class="stat"><b id="cont">0</b> itens contados · <span class="saved-pill" id="savedPill"></span> <span id="selo" style="font-size:10px;opacity:.75"></span> <span style="opacity:.4;font-size:10px">v13</span></div>
    <button class="btn" id="salvar" disabled>Revisar</button>
  </div>
</footer>

<div class="modal" id="modal">
  <div class="sheet">
    <h3>Pré-visualização do envio</h3>
    <div id="resumoEnvio" style="background:#eef6ee;border:1px solid var(--borda);border-radius:10px;padding:10px 12px;margin:.2em 0 1em;font-size:14px"></div>
    <p style="color:var(--sub);font-size:12px;margin:.2em 0 1em">
      Confira a <b>loja</b> e a quantidade de itens. Ao confirmar, o estoque dos <b>insumos</b> será gravado no SharePoint.</p>
    <pre id="payload"></pre>
    <div id="envioStatus" style="font-size:13px;margin:10px 0;min-height:18px"></div>
    <button class="btn" id="btnEnviar" style="width:100%;background:var(--verde2)">Confirmar e enviar</button>
    <button id="fechar" style="margin-top:8px;width:100%;padding:11px;border-radius:11px;border:1px solid var(--borda);background:#fff;color:var(--sub);font-family:inherit;font-size:14px">Fechar</button>
  </div>
</div>

<script>
const RAW = "https://raw.githubusercontent.com/marcius-ai/wayfoods-data/main/wayfoods_data.json";
const LOJA_PILOTO = "São José dos Campos";
// URL do fluxo de gravação: guardada SÓ no aparelho (não vai pro código público)
function getFlowUrl(){ return localStorage.getItem("contagem::flowUrl") || ""; }
function getSyncUrl(){ return localStorage.getItem("contagem::syncUrl") || ""; }
// mapa código→ID da lista EstoqueInsumos (linhas de SJC)
const ID_SJC = {};
"001:1,002:2,003:3,004:4,005:6,006:5,007:7,008:8,009:9,010:10,011:14,012:13,013:12,014:11,015:15,016:16,017:17,018:18,019:20,020:19,021:21,022:22,023:24,024:25,025:23,026:27,027:26,028:28,029:29,030:30,031:31,032:32,033:34,034:36,035:33,036:35,037:38,038:37,039:39,040:40,041:41,042:42,043:43,044:44,045:45,046:47,047:46,048:48,049:49,050:50,051:51,052:52,053:54,054:57,055:53,056:55,057:56,058:58,059:59,060:60,061:61,062:66,063:65,064:62,065:64,066:63,067:67,068:72,069:68,070:69,071:71,072:70,073:73,074:74,075:75,076:76,077:78,078:79,079:77,080:81,081:80,082:82,083:83,084:85,085:84,086:86,087:87,088:88,089:90,090:89,091:96,092:92,093:95,094:91,095:94,096:93,097:97,098:99,099:98,100:102,101:100,102:101,103:105,104:104,105:103,106:107,107:108,108:109,109:110,110:106,111:111,112:112,113:113,114:114,115:115,116:116,117:117,118:118,119:119,120:120,121:121,122:122,123:123,124:124,125:125,126:126,127:127,128:128,129:129,130:130,131:131,132:132,133:133,134:134,135:135,136:136,137:137,138:138,139:139,140:140,141:141,142:142,143:143,144:144,145:145,146:146,147:147,148:148,149:149,150:150,151:151,152:152,153:153,154:154,155:155,156:156,157:157,158:158,159:159,160:160,161:161,162:162,163:163,164:164,165:165,166:166,167:167,168:168,169:169,170:170,171:171,172:172,173:173,174:174,175:175,176:176,177:177".split(",").forEach(p=>{const x=p.split(":"); ID_SJC["INS-"+x[0]]=+x[1];});
// Um item só é gravável se tiver destino na lista de estoque:
// insumo precisa estar no mapa ID_SJC; preparo precisa ser REC-001..105
// (EstoquePorcionamentos tem os itens 1..105, com Id == número do código).
const MAX_REC = 105;
function gravavel(it){
  if(it.tipo === "insumo") return !!ID_SJC[it.code];
  const n = +it.code.slice(4);
  return n >= 1 && n <= MAX_REC;
}

let ITENS = [];            // {code,nome,categoria,unidade,tipo,almox}
let estado = {};           // code -> quantidade (string)
let abaAtual = null;       // almoxarifado selecionado
let tipoAtual = "insumo";  // insumo | preparo
const ORDEM_ALMOX = ["Congelado","Resfriado","Seco"];
let GERADO_EM = null;

const $ = s => document.querySelector(s);
const val = f => (f && typeof f === "object") ? f.Value : f;

function chaveLS(){ return "contagem::" + $("#loja").value + "::" + $("#data").value; }

function carregarEstado(){
  try{ estado = JSON.parse(localStorage.getItem(chaveLS()) || "{}"); }
  catch(e){ estado = {}; }
}
function salvarEstado(){
  localStorage.setItem(chaveLS(), JSON.stringify(estado));
  $("#savedPill").textContent = "rascunho salvo no aparelho";
}

async function baixarRaiz(){
  const r = await fetch(RAW + "?t=" + Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

/* LEITURA GARANTIDAMENTE FRESCA.
   A CDN do raw.githubusercontent IGNORA a query string: o ?t= NAO fura o cache
   e ela chega a servir versao de minutos atras. Mas a URL fixada no SHA do
   commit e IMUTAVEL — logo nunca vem de cache. Entao: pergunta ao GitHub qual
   o ultimo commit do arquivo e le por esse SHA.
   Se a API falhar (limite de 60 req/h por IP), cai na leitura normal. */
async function baixarRaizFresca(){
  try{
    const c = await fetch("https://api.github.com/repos/marcius-ai/wayfoods-data/commits"
                          + "?path=wayfoods_data.json&per_page=1&t=" + Date.now(), {cache:"no-store"});
    if(!c.ok) throw new Error("api " + c.status);
    const sha = (await c.json())[0].sha;
    const r = await fetch("https://raw.githubusercontent.com/marcius-ai/wayfoods-data/"
                          + sha + "/wayfoods_data.json", {cache:"no-store"});
    if(!r.ok) throw new Error("raw " + r.status);
    return r.json();
  }catch(e){
    return baixarRaiz();   // degrada para a leitura normal
  }
}

function aplicarDados(raiz){
    const P = k => { const v = raiz[k]; return typeof v === "string" ? JSON.parse(v) : v; };
    GERADO_EM = raiz.geradoEm || null;

    const insumos = P("insumos").map(i => ({
      code:i.Title, nome:i.field_1, categoria:val(i.field_2)||"Sem categoria",
      unidade:val(i.field_3)||"un", tipo:"insumo", almox:val(i.Almoxarifado)||"Sem local",
      ordem: (typeof i.OrdemEstoque === "number" ? i.OrdemEstoque : null)
    }));
    // Almoxarifado e OrdemEstoque dos PREPAROS moram em estoquePorcionamentos,
    // NAO em receitas (essa lista nao tem essas colunas). A lista receitas
    // continua mandando em "quem esta ativo" e no nome.
    const PORC = {};
    (P("estoquePorcionamentos") || []).forEach(p => { if (p.Title) PORC[p.Title] = p; });
    const preparos = P("receitas").filter(r => r.Ativa !== false).map(r => {
      const p = PORC[r.Title] || {};
      return {
        code:r.Title, nome:(p.field_1 || r.field_1), categoria:val(r.field_3)||"Sem categoria",
        unidade:val(p.field_4)||val(r.field_5)||"un", tipo:"preparo",
        almox:val(p.Almoxarifado)||"Sem local",
        ordem: (typeof p.OrdemEstoque === "number" ? p.OrdemEstoque : null)
      };
    });
    ITENS = [...insumos, ...preparos];

  carregarEstado();
  montarTabs();
  render();
  pintarSelo();
  $("#salvar").disabled = false;
}

async function carregar(){
  try{ aplicarDados(await baixarRaiz()); }
  catch(e){ $("#app").innerHTML = '<div class="error">Falha ao carregar os dados.<br>'+e.message+'</div>'; }
}

/* ATUALIZAR CATALOGO — espelha o SharePoint sob demanda.
   1) chama o fluxo que republica o JSON a partir das listas
   2) fica conferindo ate o campo geradoEm MUDAR de verdade
   3) so entao recarrega a tela e diz "pronto"
   Sem a URL configurada, faz so uma releitura furando o cache. */
async function sincronizar(){
  const btn=$("#btnSync"), msg=$("#syncMsg");
  const antes = GERADO_EM;
  btn.disabled=true; msg.style.color="var(--sub)";
  try{
    // Republicacao SEM fluxo novo e SEM segredo novo:
    // um MERGE VAZIO (so __metadata, nenhum campo) na linha de RESERVA REC-076
    // bump o Modified sem alterar dado nenhum -> dispara o gatilho
    // "WayFoods - Trigger PAI EstoquePorcionamentos" -> republica o JSON.
    // REC-076 e uma reserva INATIVA: nao aparece na contagem e nada depende dela.
    const url=getSyncUrl()||getFlowUrl();
    if(!url){
      msg.textContent="Buscando a versão mais recente…";
      aplicarDados(await baixarRaizFresca());
      msg.textContent="Recarregado. (Este aparelho ainda não foi configurado — peça o link de configuração ao gestor.)";
      msg.style.color="#b06a00";
      return;
    }
    msg.textContent="Pedindo ao SharePoint os dados novos…";
    const SITE="https://domrubi.sharepoint.com/sites/WayFoods";
    await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        uri: SITE+"/_api/web/lists/getbytitle('EstoquePorcionamentos')/items(76)",
        body: JSON.stringify({__metadata:{type:"SP.Data.EstoquePorcionamentosListItem"}})
      })});
    const limite=Date.now()+150000;      // ate 2min30
    let tentativa=0;
    while(Date.now()<limite){
      await new Promise(r=>setTimeout(r,5000));
      tentativa++;
      msg.textContent="Atualizando… aguarde ("+(tentativa*5)+"s)";
      let raiz=null;
      try{ raiz=await baixarRaizFresca(); }catch(e){ continue; }
      if(raiz && raiz.geradoEm && raiz.geradoEm!==antes){
        aplicarDados(raiz);
        msg.textContent="✅ Catálogo atualizado. Pode contar.";
        msg.style.color="var(--verde2)";
        return;
      }
    }
    msg.textContent="⚠ O pedido foi enviado, mas o catálogo ainda não voltou atualizado. Espere 1 minuto e clique de novo.";
    msg.style.color="#bf0417";
  }catch(e){
    msg.textContent="⚠ Não consegui atualizar: "+e.message;
    msg.style.color="#bf0417";
  }finally{
    btn.disabled=false;
  }
}

function pintarSelo(){
  const el = $("#selo"); if(!el) return;
  if(!GERADO_EM){ el.textContent=""; return; }
  const d = new Date(GERADO_EM);
  const horas = (Date.now() - d.getTime()) / 36e5;
  const quando = d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  let txt, cor;
  if(horas < 2){ txt = "dados de agora ("+quando+")"; cor = "var(--sub)"; }
  else if(horas < 24){ txt = "dados de "+quando; cor = "var(--sub)"; }
  else { txt = "⚠ dados de "+quando+" ("+Math.floor(horas/24)+" dias atras)"; cor = "#bf0417"; }
  el.textContent = txt; el.style.color = cor;
}

function montarTabs(){
  const presentes = [...new Set(ITENS.filter(i=>i.tipo===tipoAtual).map(i=>i.almox))];
  // A aba segue a MENOR OrdemEstoque do almoxarifado — ou seja, a sequencia
  // que a gestora cadastrou no SharePoint. Sem ordem definida, cai na lista
  // fixa historica e depois em alfabetica.
  const minOrdem = a => {
    const v = ITENS.filter(i=>i.tipo===tipoAtual && i.almox===a && i.ordem!=null).map(i=>i.ordem);
    return v.length ? Math.min(...v) : Infinity;
  };
  const ordenadas = presentes.slice().sort((a,b)=>{
    const oa=minOrdem(a), ob=minOrdem(b);
    if(oa!==ob) return oa-ob;
    const ia=ORDEM_ALMOX.indexOf(a), ib=ORDEM_ALMOX.indexOf(b);
    if(ia!==ib) return (ia<0?99:ia)-(ib<0?99:ib);
    return a.localeCompare(b,'pt');
  });
  if(!abaAtual || !ordenadas.includes(abaAtual)) abaAtual = ordenadas[0];
  $("#tabs").innerHTML = ordenadas.map(a=>{
    const n = ITENS.filter(i=>i.tipo===tipoAtual && i.almox===a).length;
    return '<div class="tab'+(a===abaAtual?' active':'')+'" data-tab="'+a+'">'+a+
      '<span class="n">'+n+' itens</span></div>';
  }).join("");
}

function render(){
  const termo = $("#busca").value.trim().toLowerCase();
  const lista = ITENS.filter(i => i.tipo === tipoAtual && i.almox === abaAtual)
    .filter(i => !termo || i.nome.toLowerCase().includes(termo) || i.code.toLowerCase().includes(termo));

  // Se houver OrdemEstoque definida, lista plana na sequência do estoque.
  // Senão, agrupa por categoria (ordem alfabética, itens por código).
  const temOrdem = lista.some(i => i.ordem != null);
  let secoes;
  if(temOrdem){
    const ordenada = lista.slice().sort((a,b)=>{
      if(a.ordem != null && b.ordem != null) return a.ordem - b.ordem;
      if(a.ordem != null) return -1;
      if(b.ordem != null) return 1;
      return a.nome.localeCompare(b.nome,'pt');
    });
    secoes = [["Ordem do estoque", ordenada]];
  } else {
    const grupos = {};
    lista.forEach(i => { (grupos[i.categoria] = grupos[i.categoria] || []).push(i); });
    secoes = Object.keys(grupos).sort((a,b)=>a.localeCompare(b,'pt'))
      .map(cat => [cat, grupos[cat].sort((a,b)=>a.code.localeCompare(b.code))]);
  }

  let html = "";
  if(!lista.length){ html = '<div class="loading">Nenhum item encontrado.</div>'; }
  secoes.forEach(([titulo, itens]) => {
    const preench = itens.filter(i => estado[i.code]).length;
    html += '<details class="group" open><summary>'+titulo+
      '<span class="badge"><b>'+preench+'</b>/'+itens.length+'</span></summary>';
    itens.forEach(i => {
      const q = estado[i.code] || "";
      const semDestino = !gravavel(i);
      html += '<div class="item'+(q?' filled':'')+'" data-code="'+i.code+'">'+
        '<div class="info"><div class="nome">'+i.nome+'</div>'+
        '<div class="sub">'+i.code+' · '+i.unidade+'</div>'+
        (semDestino ? '<div class="sub" style="color:var(--verm);font-weight:600">⚠ sem cadastro de estoque — NÃO será gravado</div>' : '')+
        '</div>'+
        '<div class="stepper">'+
          '<button data-act="dec">−</button>'+
          '<input class="qty" inputmode="decimal" value="'+q+'" placeholder="0">'+
          '<button data-act="inc">+</button>'+
          '<span class="unit">'+i.unidade+'</span>'+
        '</div></div>';
    });
    html += '</details>';
  });
  $("#app").innerHTML = html;
  atualizarContador();
}

function setQtd(code, v){
  v = (v+"").replace(",",".").replace(/[^0-9.]/g,"");
  if(v==="" || v==="0"){ delete estado[code]; } else { estado[code]=v; }
  salvarEstado();
  atualizarContador();
}

function atualizarContador(){
  $("#cont").textContent = Object.keys(estado).length;
}

// ---- eventos ----
$("#app").addEventListener("input", e=>{
  if(e.target.classList.contains("qty")){
    const row=e.target.closest(".item");
    setQtd(row.dataset.code, e.target.value);
    row.classList.toggle("filled", !!estado[row.dataset.code]);
    const sum=row.closest(".group").querySelector(".badge b");
    const itens=row.closest(".group").querySelectorAll(".item");
    sum.textContent=[...itens].filter(it=>estado[it.dataset.code]).length;
  }
});
$("#app").addEventListener("click", e=>{
  const b=e.target.closest("button[data-act]"); if(!b) return;
  const row=b.closest(".item"); const inp=row.querySelector(".qty");
  let n=parseFloat((inp.value||"0").replace(",","."))||0;
  const step = row.querySelector(".sub").textContent.includes(" un") ? 1 : 0.5;
  n = b.dataset.act==="inc" ? n+step : Math.max(0,n-step);
  inp.value = Number.isInteger(n)? n : n.toFixed(1);
  setQtd(row.dataset.code, inp.value);
  row.classList.toggle("filled", !!estado[row.dataset.code]);
  const sum=row.closest(".group").querySelector(".badge b");
  const itens=row.closest(".group").querySelectorAll(".item");
  sum.textContent=[...itens].filter(it=>estado[it.dataset.code]).length;
});
$("#tabs").addEventListener("click", e=>{
  const t = e.target.closest(".tab"); if(!t) return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); abaAtual=t.dataset.tab; window.scrollTo(0,0); render();
});
$("#busca").addEventListener("input", render);
$("#tipo").addEventListener("change", e=>{tipoAtual=e.target.value; abaAtual=null; $("#busca").value=""; montarTabs(); render();});
$("#loja").addEventListener("change", ()=>{localStorage.setItem("contagem::ultimaLoja",$("#loja").value);carregarEstado();render();});
$("#data").addEventListener("change", ()=>{carregarEstado();render();});

$("#salvar").addEventListener("click", ()=>{
  const linhas = Object.keys(estado).map(code=>{
    const it = ITENS.find(i=>i.code===code);
    return { Item:code, Tipo:it.tipo==="insumo"?"Insumo":"Preparo",
             Quantidade:parseFloat(estado[code]), Unidade:it.unidade };
  });
  const payload = { Loja:$("#loja").value, DataContagem:$("#data").value, Itens:linhas };
  const [a,m,d]=$("#data").value.split("-");
  $("#resumoEnvio").innerHTML = 'Loja: <b style="color:var(--verde)">'+$("#loja").value+'</b>'+
    '<br>Data: <b>'+d+'/'+m+'/'+a+'</b> · <b>'+linhas.length+'</b> itens';
  $("#payload").textContent = JSON.stringify(payload, null, 2);
  const ehPiloto = $("#loja").value === LOJA_PILOTO;
  $("#envioStatus").textContent = ehPiloto ? "" : "Piloto: gravação só para São José dos Campos por enquanto.";
  $("#envioStatus").style.color = ehPiloto ? "var(--sub)" : "var(--verm)";
  $("#btnEnviar").disabled = !ehPiloto;
  $("#modal").classList.add("show");
});
$("#fechar").addEventListener("click", ()=>$("#modal").classList.remove("show"));

async function enviar(){
  const st=$("#envioStatus"), btn=$("#btnEnviar");
  let url = getFlowUrl();
  if(!url){
    url = (prompt("Este aparelho ainda não foi configurado para gravar. Chame o responsável (Marcius) para configurar. (URL de gravação):")||"").trim();
    if(!url){ return; }
    localStorage.setItem("contagem::flowUrl", url);
  }
  const iso = new Date().toISOString();
  const reqs=[]; const ignorados=[];
  Object.keys(estado).forEach(code=>{
    const it=ITENS.find(i=>i.code===code); if(!it) return;
    const qtd=parseFloat((estado[code]+"").replace(",","."))||0;
    if(it.tipo==="insumo"){
      const id=ID_SJC[code]; if(!id){ ignorados.push(code); return; }
      reqs.push({uri:"_api/web/lists/getbytitle('EstoqueInsumos')/items("+id+")",
        body:JSON.stringify({"__metadata":{"type":"SP.Data.EstoqueInsumosListItem"},"EstoqueAtual":qtd,"DataContagem":iso})});
    } else {
      const n=+code.slice(4); const id=(n>=1&&n<=MAX_REC)?n:null; if(!id){ ignorados.push(code); return; }
      reqs.push({uri:"_api/web/lists/getbytitle('EstoquePorcionamentos')/items("+id+")",
        body:JSON.stringify({"__metadata":{"type":"SP.Data.EstoquePorcionamentosListItem"},"field_5":qtd})});
    }
  });
  if(!reqs.length){ st.textContent="Nada para enviar."; st.style.color="var(--sub)"; return; }
  btn.disabled=true; let ok=0, fail=0;
  for(let i=0;i<reqs.length;i+=6){
    const res=await Promise.allSettled(reqs.slice(i,i+6).map(x=>
      fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(x)})));
    res.forEach(r=>{ if(r.status==="fulfilled" && r.value.ok) ok++; else fail++; });
    st.textContent="Enviando… "+(ok+fail)+"/"+reqs.length; st.style.color="var(--sub)";
  }
  // "Enviados" e não "Gravados": o fluxo responde 202 (aceitou) antes de o
  // SharePoint confirmar a escrita. Só o fluxo sabe se o MERGE deu certo.
  st.innerHTML="✅ Enviados <b>"+ok+"</b> itens"+(fail?" · <b style='color:var(--verm)'>"+fail+" falha(s)</b>":"")+
    (ignorados.length
      ? "<div style='margin-top:8px;padding:8px 10px;border-radius:10px;background:#fdeaec;"+
        "border:1px solid var(--verm);color:var(--verm);font-size:13px;font-weight:600'>"+
        "⚠ "+ignorados.length+" item(ns) NÃO foram gravados — sem cadastro de estoque:<br>"+
        "<span style='font-weight:400'>"+ignorados.join(", ")+"</span><br>"+
        "<span style='font-weight:400'>Anote esses no papel e avise o gestor.</span></div>"
      : "");
  st.style.color="var(--verde2)";
  btn.disabled=false;
}
$("#btnEnviar").addEventListener("click", enviar);
$("#btnSync").addEventListener("click", sincronizar);

// configuração da URL de gravação via link (o gestor abre 1x em cada aparelho):
//   contagem.html#cfg=<url-de-gravacao-encodada>
(function(){
  const h = location.hash || "";
  const m = h.match(/cfg=([^&]+)/);
  const ms = h.match(/sync=([^&]+)/);
  if(m || ms){
    const feito=[];
    if(m){ try{ const u=decodeURIComponent(m[1]).trim(); if(u){ localStorage.setItem("contagem::flowUrl",u); feito.push("gravar a contagem"); } }catch(e){} }
    if(ms){ try{ const u=decodeURIComponent(ms[1]).trim(); if(u){ localStorage.setItem("contagem::syncUrl",u); feito.push("atualizar o catálogo"); } }catch(e){} }
    history.replaceState(null,"",location.pathname+location.search);
    alert("✅ Aparelho configurado para: "+feito.join(" e ")+".");
  }
})();

// data default = hoje
const hoje=new Date(); $("#data").value=
  hoje.getFullYear()+"-"+String(hoje.getMonth()+1).padStart(2,"0")+"-"+String(hoje.getDate()).padStart(2,"0");

// restaura a última loja usada neste aparelho
const ultimaLoja = localStorage.getItem("contagem::ultimaLoja");
if(ultimaLoja){ const op=[...$("#loja").options].some(o=>o.value===ultimaLoja); if(op) $("#loja").value=ultimaLoja; }

carregar();
</script>
