<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Contagem de Estoque — Way Foods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --verde:#002d02; --verde2:#1a4a1a; --verm:#bf0417; --laranja:#f2a413;
    --bg:#f5f0e8; --card:#fff; --borda:#e8e2d9; --txt:#1a1a1a; --sub:#6b6560;
    --radius:14px; --maxw:560px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:'DM Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{padding-bottom:96px}

  header{position:sticky;top:0;z-index:20;background:var(--verde);padding:10px 12px 10px}
  header>.brand,header>.meta,header>.tabs,header>.search{max-width:var(--maxw);margin-left:auto;margin-right:auto}
  .brand{display:flex;align-items:center;gap:10px}
  .brand img{width:40px;height:40px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--laranja)}
  .brand .tit{font-weight:700;font-size:15px;color:#fff;line-height:1.15}
  .brand .sub{font-size:11px;color:var(--laranja);font-weight:600}
  .meta{display:flex;gap:6px;margin-top:10px}
  .meta label{flex:1 1 0;min-width:0;font-size:10px;color:rgba(255,255,255,.6);display:flex;flex-direction:column;gap:2px}
  .meta select,.meta input{background:var(--card);color:var(--txt);border:1px solid var(--borda);
    border-radius:8px;padding:6px 6px;font-size:13px;width:100%;font-family:inherit;min-width:0}
  .meta input[type=date]{font-size:12px;padding:6px 4px}

  .tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .tab{flex:1 0 auto;text-align:center;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.18);font-size:13px;font-weight:600;color:rgba(255,255,255,.72);white-space:nowrap}
  .tab.active{background:var(--laranja);color:#3a2600;border-color:var(--laranja)}
  .tab .n{display:block;font-size:11px;font-weight:500;opacity:.85;margin-top:1px}

  .search{margin-top:8px}
  .search input{width:100%;background:var(--card);border:1px solid var(--borda);color:var(--txt);
    border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit}

  main{padding:12px;max-width:var(--maxw);margin:0 auto}
  .group{margin-bottom:10px;border:1px solid var(--borda);border-radius:var(--radius);overflow:hidden;background:var(--card)}
  .group>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;justify-content:space-between;
    align-items:center;font-weight:700;font-size:12px;color:var(--verde);background:#faf7f1;
    text-transform:uppercase;letter-spacing:.4px}
  .group>summary::-webkit-details-marker{display:none}
  .group>summary .badge{font-size:11px;color:var(--sub);font-weight:600;text-transform:none;letter-spacing:0}
  .group>summary .badge b{color:var(--verde2)}

  .item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--borda);
    background:var(--card)}
  /* alca de arrasto: so aparece no modo Organizar. Sem alca dedicada, o
     arrasto briga com o rolar da tela e com os campos de numero. */
  .alca{flex:0 0 auto;width:38px;height:40px;display:none;align-items:center;justify-content:center;
    font-size:19px;color:var(--sub);border:1px solid var(--borda);border-radius:9px;background:#faf7f1;
    touch-action:none;cursor:grab;user-select:none}
  .organizando .alca{display:flex}
  .organizando .stepper{display:none}
  .organizando .item{padding:11px 14px}
  .item.pegando{box-shadow:0 10px 22px rgba(0,0,0,.18);border-radius:12px;position:relative;z-index:30;
    border-top-color:transparent;background:#fffdf6}
  .item .info{flex:1;min-width:0}
  /* Duas linhas: nome de preparo é longo ("Estrogonofe de Iscas de Carnes
     na Mostarda") e cortar no meio deixa a pessoa sem saber o que contar. */
  .item .nome{font-size:14px;line-height:1.3;color:var(--txt);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
    overflow:hidden;overflow-wrap:anywhere}
  .item .sub{font-size:11px;color:var(--sub);margin-top:2px}
  .item.filled{background:#eef6ee}

  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{width:34px;height:38px;border-radius:9px;border:1px solid var(--borda);
    background:#faf7f1;color:var(--verde);font-size:20px;line-height:1;font-weight:700}
  .stepper button:active{background:var(--verde);color:#fff;border-color:var(--verde)}
  .qty{width:58px;height:38px;text-align:center;background:#fff;border:1px solid var(--borda);
    color:var(--verde);border-radius:9px;font-size:15px;font-weight:700;font-family:inherit}
  .qty:focus{outline:2px solid var(--laranja)}
  .unit{font-size:11px;color:var(--sub);width:42px;text-align:left;line-height:1.1}

  footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--borda);
    padding:10px 12px;display:flex;justify-content:center}
  .footwrap{display:flex;gap:10px;align-items:center;width:100%;max-width:var(--maxw)}
  footer .stat{flex:1;font-size:12px;color:var(--sub)}
  footer .stat b{color:var(--txt)}
  .btn{padding:12px 18px;border-radius:11px;border:none;font-size:15px;font-weight:700;background:var(--verm);color:#fff;font-family:inherit}
  .btn:disabled{opacity:.35}
  .syncrow{display:flex;align-items:center;gap:10px;padding:8px 12px 0}
  .btn2{padding:10px 14px;border-radius:10px;border:1px solid var(--borda);background:var(--card);
        color:var(--txt);font-size:14px;font-weight:700;font-family:inherit;white-space:nowrap}
  .btn2:disabled{opacity:.5}
  .syncmsg{font-size:12px;color:var(--sub);line-height:1.3}

  .loading,.error{padding:40px 16px;text-align:center;color:var(--sub)}
  .error{color:var(--verm)}

  /* modal preview */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:50}
  .modal.show{display:flex}
  .sheet{background:var(--card);width:100%;max-height:80vh;border-radius:18px 18px 0 0;padding:16px;overflow:auto}
  .sheet h3{margin:0 0 6px;color:var(--verde)}
  .sheet pre{background:#faf7f1;border:1px solid var(--borda);border-radius:10px;padding:12px;
    font-size:11px;overflow:auto;color:#333;white-space:pre-wrap;word-break:break-word}
  .sheet .close{margin-top:12px;width:100%;background:var(--verde);color:#fff}
  .saved-pill{font-size:11px;color:var(--verde2)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="logo.jpg" alt="Way Foods">
    <div>
      <div class="tit">Contagem de Estoque</div>
      <div class="sub">WAY FOODS</div>
    </div>
  </div>
  <div class="meta">
    <label class="loja">Loja
      <select id="loja">
        <option value="Suzano">Suzano</option>
        <option value="São José dos Campos">São José dos Campos</option>
      </select>
    </label>
    <label>Data
      <input type="date" id="data">
    </label>
    <label>Tipo
      <select id="tipo">
        <option value="insumo">Insumos</option>
        <option value="preparo">Preparos</option>
      </select>
    </label>
  </div>
  <div class="syncrow">
    <button class="btn2" id="btnSync">🔄 Atualizar catálogo</button>
    <button class="btn2" id="btnOrganizar">↕️ Organizar ordem</button>
    <div class="syncmsg" id="syncMsg">Clique antes de começar a contagem.</div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="search"><input id="busca" placeholder="Buscar item..." inputmode="search"></div>
</header>

<main id="app"><div class="loading">Entrando…</div></main>

<footer>
  <div class="footwrap">
    <div class="stat"><b id="cont">0</b> itens contados · <span class="saved-pill" id="savedPill"></span> <span id="selo" style="font-size:10px;opacity:.75"></span> <span style="opacity:.4;font-size:10px">v24</span></div>
    <button class="btn" id="salvar" disabled>Revisar</button>
  </div>
</footer>

<div class="modal" id="modal">
  <div class="sheet">
    <h3>Pré-visualização do envio</h3>
    <div id="resumoEnvio" style="background:#eef6ee;border:1px solid var(--borda);border-radius:10px;padding:10px 12px;margin:.2em 0 1em;font-size:14px"></div>
    <p style="color:var(--sub);font-size:12px;margin:.2em 0 1em">
      Confira a <b>loja</b> e a quantidade de itens. Ao confirmar, o estoque dos <b>insumos</b> será gravado no SharePoint.</p>
    <pre id="payload"></pre>
    <div id="envioStatus" style="font-size:13px;margin:10px 0;min-height:18px"></div>
    <button class="btn" id="btnEnviar" style="width:100%;background:var(--verde2)">Confirmar e enviar</button>
    <button id="fechar" style="margin-top:8px;width:100%;padding:11px;border-radius:11px;border:1px solid var(--borda);background:#fff;color:var(--sub);font-family:inherit;font-size:14px">Fechar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<script>
/* =====================================================================
   Contagem de Estoque — Way Foods — v15

   O que mudou e por quê:

   1. Quem grava é A PESSOA, com a conta Microsoft dela. Antes o aparelho
      guardava uma URL secreta no localStorage, então só funcionava em
      celular previamente configurado — e quem tivesse o link gravava.
      Agora é login normal: funciona em qualquer aparelho e o SharePoint
      registra QUEM contou.

   2. Nada de Id chumbado. A ponte "código -> linha de estoque" é montada
      lendo a própria lista. A versão anterior trazia 177 Ids escritos à
      mão; o catálogo foi para 422 insumos e 245 deles ficaram sem destino,
      em silêncio. Agora cresce sozinho: cadastrou, aparece.

   3. Os dados vêm direto do SharePoint, não de um JSON publicado. Some o
      atraso entre cadastrar e aparecer na contagem.

   4. A tela desenha por partes, para aguentar milhares de itens no celular
      sem travar.
   ===================================================================== */

const CFG = {
  // clientId NÃO é segredo: identifica o app, não autoriza nada sozinho.
  clientId : "070ac482-c9db-482d-a813-b35d74c15bb8",
  authority: "https://login.microsoftonline.com/1a07c9c7-bde3-4e69-a3c1-8c2ee8a215c1",
  site     : "domrubi.sharepoint.com,46d248aa-c512-440f-98d5-ceb4b302d485,97004cc3-6a45-41f6-b7bd-4ac509f44eea",
  escopos  : ["https://graph.microsoft.com/Sites.ReadWrite.All"]
};

const SIGLA = { "São José dos Campos": "SJC", "Suzano": "SZN" };
const POR_PAGINA = 120;          // linhas desenhadas por vez

const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let ITENS = [];            // {code,nome,categoria,unidade,unidadeCurta,porcao,tipo,almox,ordem}
let DEST  = {};            // "INS-001::SJC" -> id da linha de estoque
let estado = {};           // code -> quantidade (texto)
let abaAtual = null;
let tipoAtual = "insumo";
let LIDO_EM = null;
let organizando = false;     // modo de arrastar ligado?
let ordemSuja = false;       // mexeu e ainda nao salvou?
const movidos = new Set();   // quem foi arrastado desde o ultimo salvamento
const ORDEM_ALMOX = ["Congelado","Resfriado","Seco"];

/* ----------------------------------------------------- identidade */
let msalApp = null, conta = null;

let erroLogin = "";

function traduzirErro(e){
  const m = (e && (e.errorMessage || e.message)) || "";
  if (/AADSTS50020/.test(m))
    return "Você entrou com uma <b>conta pessoal</b> da Microsoft, não com a conta da " +
           "empresa. Toque em <b>Sair da conta</b> abaixo e entre de novo — vai aparecer " +
           "direto a tela da Way Foods.";
  if (/AADSTS65004|consent/i.test(m))
    return "Falta autorização para este aplicativo. Avise o Marcius.";
  return m ? ("Não consegui entrar: " + m.slice(0, 200)) : "";
}

async function iniciarAuth(){
  msalApp = new msal.PublicClientApplication({
    auth: { clientId: CFG.clientId, authority: CFG.authority,
            redirectUri: location.origin + location.pathname },
    // localStorage e não sessionStorage: no celular a pessoa troca de aba
    // e volta o dia inteiro; sessionStorage faria ela logar de novo sempre.
    cache: { cacheLocation: "localStorage" }
  });
  await msalApp.initialize();
  let r = null;
  try{ r = await msalApp.handleRedirectPromise(); }
  catch(e){ erroLogin = traduzirErro(e); }
  if (r && r.account) conta = r.account;
  if (!conta) conta = msalApp.getAllAccounts()[0] || null;
  if (conta) msalApp.setActiveAccount(conta);
  return conta;
}

// Erro proprio para "precisa entrar de novo": permite tratar isso na tela
// em vez de vazar texto tecnico para quem esta contando.
function SessaoExpirada(){ this.nome = "SessaoExpirada"; }

let tokenCache = { valor: null, expira: 0 };
let tokenEmVoo = null;

async function token(){
  if (!conta) throw new SessaoExpirada();
  if (tokenCache.valor && Date.now() < tokenCache.expira - 60000) return tokenCache.valor;
  // UMA aquisicao por vez. A carga dispara 4 leituras em paralelo; sem esta
  // trava, as 4 pedem token juntas, o MSAL recusa interacao concorrente
  // (interaction_in_progress) e a tela inteira morre.
  if (!tokenEmVoo){
    tokenEmVoo = msalApp.acquireTokenSilent({ scopes: CFG.escopos, account: conta })
      .then(r => {
        tokenCache = { valor: r.accessToken,
                       expira: r.expiresOn ? r.expiresOn.getTime() : Date.now() + 50*60000 };
        return r.accessToken;
      })
      .finally(() => { tokenEmVoo = null; });
  }
  try{ return await tokenEmVoo; }
  catch(e){ throw new SessaoExpirada(); }
}

// domain_hint pula a pergunta "conta pessoal ou corporativa". Existe uma
// conta PESSOAL Microsoft com o mesmo endereço financeiro@domrubi.com.br, e
// escolher ela dá AADSTS50020 ("does not exist in tenant"). Com o hint, o
// Entra vai direto para o login da organização.
function entrar(){
  // prompt "login" e NAO "select_account": existe uma conta PESSOAL da
  // Microsoft com o mesmo endereco financeiro@domrubi.com.br, e o seletor de
  // contas oferecia justamente ela -- dai o AADSTS50020 repetido. Forcando
  // autenticacao nova no endpoint do locatario, a sessao pessoal nao entra no
  // meio. O domain_hint ainda pula a pergunta "pessoal ou corporativa".
  msalApp.loginRedirect({ scopes: CFG.escopos,
                          prompt: "login",
                          extraQueryParameters: { domain_hint: "domrubi.com.br" } });
}
function sair(){ msalApp.logoutRedirect({ account: conta }); }

/* ----------------------------------------------------- Graph */
async function graph(caminho, opcoes){
  const t = await token();
  const o = opcoes || {};
  const r = await fetch(caminho.startsWith("http") ? caminho
                        : "https://graph.microsoft.com/v1.0" + caminho,
    { method: o.method || "GET", body: o.body,
      headers: Object.assign({ Authorization: "Bearer " + t,
                               "Content-Type": "application/json" }, o.headers || {}) });
  if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 300));
  return r.status === 204 ? {} : r.json();
}

async function lerLista(nome, campos){
  let url = "/sites/" + CFG.site + "/lists/" + nome +
            "/items?$top=999&$expand=fields($select=" + campos.join(",") + ")";
  const saida = [];
  while (url){
    const j = await graph(url);
    (j.value || []).forEach(x => saida.push(Object.assign({ _id: x.id }, x.fields)));
    url = j["@odata.nextLink"] || null;
  }
  return saida;
}

function gravar(lista, id, campos){
  return graph("/sites/" + CFG.site + "/lists/" + lista + "/items/" + id + "/fields",
               { method: "PATCH", body: JSON.stringify(campos) });
}

/* ----------------------------------------------------- dados */
const val = v => (v && typeof v === "object") ? (v.Value || v.LookupValue || "") : (v || "");

function tratarFalhaDeCarga(e){
  if (e instanceof SessaoExpirada || e.nome === "SessaoExpirada"){
    $("#app").innerHTML =
      '<div class="loading" style="padding:28px 16px">' +
      '<p style="margin:0 0 6px"><b>Sua sessão expirou.</b></p>' +
      '<p style="margin:0 0 14px;font-size:13px">Entre de novo para continuar a contagem. ' +
      'O que você já digitou está guardado neste aparelho.</p>' +
      '<button class="btn" id="btnEntrar2" style="padding:12px 22px">Entrar de novo</button>' +
      '<div style="margin-top:10px"><button id="btnSair2" style="padding:8px 14px;border-radius:9px;' +
      'border:1px solid var(--borda);background:#fff;color:var(--sub);font-family:inherit;font-size:13px">' +
      'Entrar com outra conta</button></div></div>';
    $("#btnEntrar2").addEventListener("click", entrar);
    $("#btnSair2").addEventListener("click", () => {
      try{ Object.keys(localStorage).filter(k => /^(msal|\{")/.test(k)).forEach(k => localStorage.removeItem(k)); }catch(e){}
      msalApp.logoutRedirect({ postLogoutRedirectUri: location.origin + location.pathname });
    });
    return;
  }
  $("#app").innerHTML =
    '<div class="loading" style="padding:28px 16px;color:var(--verm)">' +
    '<p style="margin:0 0 12px">Não consegui ler o cadastro.</p>' +
    '<p style="margin:0 0 14px;font-size:12px;opacity:.8">' + (e.message || "") + '</p>' +
    '<button class="btn" id="btnTentar" style="padding:12px 22px">Tentar de novo</button></div>';
  $("#btnTentar").addEventListener("click", () => carregar().catch(tratarFalhaDeCarga));
}

async function carregar(){
  $("#app").innerHTML = '<div class="loading">Lendo o cadastro no SharePoint…</div>';
  const [ins, rec, por, estIns, ipu, unidades] = await Promise.all([
    lerLista("Insumos",               ["Title","field_1","field_2","field_3","Ativo"]),
    lerLista("Receitas",              ["Title","field_1","field_3","Ativa"]),
    lerLista("EstoquePorcionamentos", ["Title","field_1","field_3","field_4","Almoxarifado","OrdemEstoque","Unidade"]),
    lerLista("EstoqueInsumos",        ["Title","Loja"]),
    // Quem manda na contagem do INSUMO e o InsumoPorUnidade: e la que vivem
    // ControlaEstoque, Almoxarifado e OrdemEstoque POR LOJA. O caminho fisico
    // de SJC nao e o de Suzano, entao a ordem tem mesmo de ser por loja.
    lerLista("InsumoPorUnidade",      ["InsumoLookupId","UnidadeLookupId","Almoxarifado","OrdemEstoque","ControlaEstoque","Ativo"]),
    lerLista("Unidades",              ["Title","Nome"])
  ]);

  // A ponte código -> linha gravável. É isto que substitui a lista de Ids
  // chumbada: o que estiver cadastrado entra, o que não estiver aparece
  // marcado em vermelho na tela em vez de sumir calado.
  DEST = {};
  estIns.forEach(x => { if (x.Title) DEST["INS::" + x.Title + "::" + (SIGLA[val(x.Loja)] || val(x.Loja))] = x._id; });
  por   .forEach(p => { if (p.Title) DEST["REC::" + p.Title + "::" + (val(p.Unidade) || "SJC")] = p._id; });

  // REGRA DE CONTAGEM (Marcius, 28/10): so entra na contagem quem tem
  // ALMOXARIFADO e SEQUENCIA DE CONTAGEM. Nao e filtro cosmetico — o cadastro
  // em Insumos serve tambem para classificar nota fiscal, e boa parte do que
  // esta ali nao se conta (um pacote de bala comprado uma vez, um micro-ondas).
  // Preencher a sequencia e o ato de dizer "este entra, nesta posicao".
  const naContagem = x => !!val(x.Almoxarifado) && typeof x.OrdemEstoque === "number";

  // sigla da loja desta linha do IPU (as Unidades guardam SJC / SZN)
  const SIG_UNID = {};
  unidades.forEach(u => { SIG_UNID[u._id] = val(u.Title); });
  const CAT_INS = {};
  ins.forEach(i => { if (i.Ativo !== false && i.Title) CAT_INS[i._id] = i; });

  const insumos = ipu
    .filter(x => x.Ativo !== false
              && x.ControlaEstoque === true          // o que nao se conta nem aparece
              && CAT_INS[x.InsumoLookupId]
              && naContagem(x))                      // almoxarifado + sequencia
    .map(x => {
      const i = CAT_INS[x.InsumoLookupId];
      return {
        code: i.Title, nome: val(i.field_1) || i.Title,
        categoria: val(i.field_2) || "Sem categoria",
        unidade: val(i.field_3) || "un", unidadeCurta: val(i.field_3) || "un",
        porcao: null, tipo: "insumo", almox: val(x.Almoxarifado) || "Sem local",
        loja: SIG_UNID[x.UnidadeLookupId] || "",
        ordem: (typeof x.OrdemEstoque === "number" ? x.OrdemEstoque : null),
        // a ordem agora se regrava no IPU: sem valor unico e aceita decimal
        ordemLista: "InsumoPorUnidade", ordemId: x._id
      };
    });

  const PORC = {};
  por.forEach(p => { if (p.Title) PORC[p.Title] = p; });
  const preparos = rec.filter(r => r.Ativa !== false && r.Title && naContagem(PORC[r.Title] || {})).map(r => {
    const p = PORC[r.Title] || {};
    return {
      code: r.Title, nome: val(p.field_1) || val(r.field_1) || r.Title,
      categoria: val(r.field_3) || "Sem categoria",
      // Preparo se conta em UNIDADE: vem porcionado em saquinho, e uma
      // porção é um saquinho. O peso da porção vai no subtítulo, que é o
      // que orienta no caso do que não vem em saquinho (molho a granel).
      unidade: "un", unidadeCurta: "un", tipo: "preparo",
      porcao: p.field_3 ? (((+p.field_3) + "").replace(".", ",") + " " + (val(p.field_4) || "g")) : null,
      almox: val(p.Almoxarifado) || "Sem local",
      loja: val(p.Unidade) || "SJC",
      ordem: (typeof p.OrdemEstoque === "number" ? p.OrdemEstoque : null),
      ordemLista: "EstoquePorcionamentos", ordemId: p._id
    };
  });

  ITENS = [...insumos, ...preparos];
  LIDO_EM = new Date();
  marcarLojasSemCadastro();
  pintarSelo();
  montarTabs();
  render();
}

// Quantos destinos de gravacao existem por loja. Hoje praticamente tudo
// e SJC: Suzano tem 1 linha solta. Sem isto, escolher Suzano enchia a tela
// de 142 tarjas vermelhas identicas, o que parece defeito do app e e so a
// loja errada selecionada.
function destinosPorLoja(){
  const c = {};
  Object.keys(DEST).forEach(k => { const sig = k.split("::")[2]; c[sig] = (c[sig] || 0) + 1; });
  return c;
}

// "Sem cadastro" nao pode significar exatamente zero: Suzano tem UMA linha
// solta em EstoqueInsumos, e isso bastava para o aviso nao aparecer e a tela
// encher de tarjas vermelhas de novo.
function cadastroDaLojaAtual(){
  const sig = SIGLA[$("#loja").value] || $("#loja").value;
  return destinosPorLoja()[sig] || 0;
}

function lojaAtendida(sig){
  const n = destinosPorLoja()[sig] || 0;
  return n >= 20;        // um punhado de linhas soltas nao e cadastro
}

function marcarLojasSemCadastro(){
  [...$("#loja").options].forEach(o => {
    o.textContent = o.value + (lojaAtendida(SIGLA[o.value] || o.value) ? "" : " — sem cadastro");
  });
}

function destinoDe(it){
  const sig = SIGLA[$("#loja").value] || $("#loja").value;
  return DEST[(it.tipo === "insumo" ? "INS::" : "REC::") + it.code + "::" + sig];
}
const gravavel = it => !!destinoDe(it);

/* ----------------------------------------------------- estado local */
function chaveLS(){ return "contagem::" + $("#loja").value + "::" + $("#data").value; }
function carregarEstado(){
  try{ estado = JSON.parse(localStorage.getItem(chaveLS()) || "{}"); }catch(e){ estado = {}; }
}
function salvarEstado(){
  localStorage.setItem(chaveLS(), JSON.stringify(estado));
  const p = $("#savedPill"); p.textContent = "rascunho salvo"; p.style.opacity = 1;
  clearTimeout(salvarEstado._t);
  salvarEstado._t = setTimeout(() => { p.style.opacity = 0; }, 1500);
}

function pintarSelo(){
  const s = $("#selo");
  if (!LIDO_EM){ s.textContent = ""; return; }
  const h = String(LIDO_EM.getHours()).padStart(2,"0") + ":" + String(LIDO_EM.getMinutes()).padStart(2,"0");
  s.textContent = "cadastro lido às " + h + (conta ? " · " + (conta.username || "") : "");
}

/* ----------------------------------------------------- abas */
function lojaAtual(){ return SIGLA[$("#loja").value] || $("#loja").value; }

function listaDoTipo(){
  const busca = ($("#busca").value || "").trim().toLowerCase();
  return ITENS.filter(i => i.tipo === tipoAtual && i.loja === lojaAtual())
              .filter(i => !busca || i.nome.toLowerCase().includes(busca) || i.code.toLowerCase().includes(busca));
}

function montarTabs(){
  const porAlmox = {};
  ITENS.filter(i => i.tipo === tipoAtual && i.loja === lojaAtual()).forEach(i => {
    (porAlmox[i.almox] = porAlmox[i.almox] || []).push(i);
  });
  const nomes = Object.keys(porAlmox).sort((a,b) => {
    const ia = ORDEM_ALMOX.indexOf(a), ib = ORDEM_ALMOX.indexOf(b);
    if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    return a.localeCompare(b);
  });
  if (!nomes.includes(abaAtual)) abaAtual = nomes[0] || null;
  $("#tabs").innerHTML = nomes.map(n =>
    '<div class="tab' + (n === abaAtual ? ' active' : '') + '" data-almox="' + n.replace(/"/g,'&quot;') + '">' +
    n + '<small>' + porAlmox[n].length + ' itens</small></div>').join("");
}

/* ----------------------------------------------------- desenho */
let fila = [], desenhados = 0, observador = null;

function linhaHTML(i){
  const q = estado[i.code] || "";
  const sub = i.code + (i.porcao ? ' · porção ' + i.porcao : ' · ' + i.unidade);
  return '<div class="item' + (q ? ' filled' : '') + '" data-code="' + i.code + '">' +
    '<div class="alca" data-alca>≡</div>' +
    '<div class="info"><div class="nome">' + i.nome + '</div>' +
    '<div class="sub">' + sub + '</div>' +
    (gravavel(i) ? '' : '<div class="sub" style="color:var(--verm);font-weight:600">⚠ sem cadastro de estoque — NÃO será gravado</div>') +
    '</div>' +
    '<div class="stepper">' +
      '<button data-act="dec">−</button>' +
      '<input class="qty" inputmode="decimal" value="' + q + '" placeholder="0">' +
      '<button data-act="inc">+</button>' +
      '<span class="unit">' + (i.unidadeCurta || i.unidade) + '</span>' +
    '</div></div>';
}

function desenharMais(){
  const lote = fila.slice(desenhados, desenhados + POR_PAGINA);
  if (!lote.length) return;
  const alvo = $("#lista");
  if (!alvo) return;
  alvo.insertAdjacentHTML("beforeend", lote.map(linhaHTML).join(""));
  desenhados += lote.length;
  const fim = $("#fim");
  if (fim) fim.textContent = desenhados < fila.length
    ? "mostrando " + desenhados + " de " + fila.length + "…" : "";
}

function render(){
  // Loja sem nenhum cadastro de estoque: um aviso so, em vez de repetir a
  // mesma tarja em cada linha da lista.
  if (!lojaAtendida(SIGLA[$("#loja").value] || $("#loja").value)){
    $("#app").innerHTML =
      '<div class="loading" style="padding:26px 16px">' +
      '<p style="margin:0 0 8px;font-size:15px"><b>Nenhum item cadastrado para ' +
      $("#loja").value + '.</b></p>' +
      '<p style="margin:0 0 4px;font-size:13px">O estoque hoje está cadastrado em ' +
      '<b>São José dos Campos</b>. Se você não é dessa loja, fale com o Marcius ' +
      'antes de contar — nada aqui seria gravado.</p>' +
      '<p style="margin:14px 0 0;font-size:13px">Confira o campo <b>Loja</b>, lá em cima.</p>' +
      '</div>';
    $("#tabs").innerHTML = "";
    atualizarContador();
    return;
  }
  const todos = listaDoTipo();
  // Todo item exibido tem sequencia (a regra garante), entao a ordem da tela
  // e a ordem fisica de caminhar pelo almoxarifado.
  fila = todos.filter(i => !abaAtual || i.almox === abaAtual)
              .sort((a,b) => (a.ordem - b.ordem) || a.nome.localeCompare(b.nome));
  desenhados = 0;
  const preench = fila.filter(i => estado[i.code]).length;
  $("#app").innerHTML =
    '<details class="group" open><summary>ORDEM DO ESTOQUE' +
    '<span class="badge"><b>' + preench + '</b>/' + fila.length + '</span></summary>' +
    '<div id="lista"></div><div id="fim" class="loading" style="font-size:12px"></div></details>';

  // No modo Organizar desenha a aba inteira: nao da para arrastar um item
  // ate uma posicao que ainda nao foi desenhada.
  if (organizando){
    $("#app").classList.add("organizando");
    while (desenhados < fila.length) desenharMais();
    ativarArrasto();
    return atualizarContador();
  }
  $("#app").classList.remove("organizando");
  desenharMais();
  // Desenhar tudo de uma vez trava o celular quando a lista passa de
  // algumas centenas. O resto entra conforme ela rola.
  if (observador) observador.disconnect();
  const fim = $("#fim");
  if (fim){
    observador = new IntersectionObserver(e => { if (e[0].isIntersecting) desenharMais(); },
                                          { rootMargin: "400px" });
    observador.observe(fim);
  }
  atualizarContador();
}

/* ---------------------------------------------------------- arrastar
   Arrasto com pointer events (o drag-and-drop do HTML nao funciona em
   toque). A linha sobe um pouco e troca de lugar com a vizinha assim que
   cruza o meio dela; perto da borda da tela, a lista rola sozinha. */
function ativarArrasto(){
  const lista = $("#lista");
  if (!lista || lista.dataset.arrasto) return;
  lista.dataset.arrasto = "1";

  let alvo = null, inicioY = 0, desloc = 0, rolagem = 0, animando = null;

  const parar = () => { if (animando){ cancelAnimationFrame(animando); animando = null; } };

  function rolarSozinho(){
    if (!alvo) return parar();
    if (rolagem) window.scrollBy(0, rolagem);
    animando = requestAnimationFrame(rolarSozinho);
  }

  lista.addEventListener("pointerdown", e => {
    const h = e.target.closest("[data-alca]");
    if (!h) return;
    alvo = h.closest(".item");
    inicioY = e.clientY; desloc = 0;
    alvo.classList.add("pegando");
    try{ alvo.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });

  lista.addEventListener("pointermove", e => {
    if (!alvo) return;
    e.preventDefault();
    desloc = e.clientY - inicioY;
    alvo.style.transform = "translateY(" + desloc + "px)";

    const r = alvo.getBoundingClientRect();
    const anterior = alvo.previousElementSibling;
    const proximo  = alvo.nextElementSibling;
    if (anterior){
      const ra = anterior.getBoundingClientRect();
      if (r.top < ra.top + ra.height / 2){
        anterior.before(alvo);               // sobe uma posicao
        inicioY += ra.height; desloc -= ra.height;
        alvo.style.transform = "translateY(" + desloc + "px)";
        ordemSuja = true; movidos.add(alvo.dataset.code);
      }
    }
    if (proximo){
      const rp = proximo.getBoundingClientRect();
      if (r.bottom > rp.top + rp.height / 2){
        proximo.after(alvo);                 // desce uma posicao
        inicioY -= rp.height; desloc += rp.height;
        alvo.style.transform = "translateY(" + desloc + "px)";
        ordemSuja = true; movidos.add(alvo.dataset.code);
      }
    }
    // rola sozinho perto das bordas, senao listas longas ficam impossiveis
    const margem = 90;
    rolagem = e.clientY < margem ? -12
            : e.clientY > window.innerHeight - margem ? 12 : 0;
    if (rolagem && !animando) rolarSozinho(); else if (!rolagem) parar();
  });

  const soltar = () => {
    if (!alvo) return;
    alvo.classList.remove("pegando");
    alvo.style.transform = "";
    alvo = null; rolagem = 0; parar();
    pintarBotaoOrdem();
  };
  lista.addEventListener("pointerup", soltar);
  lista.addEventListener("pointercancel", soltar);
}

function pintarBotaoOrdem(){
  const b = $("#btnOrganizar");
  b.textContent = !organizando ? "↕️ Organizar ordem"
                 : ordemSuja   ? "💾 Salvar ordem"
                 : "✓ Pronto";
}

async function salvarOrdem(){
  const b = $("#btnOrganizar"), m = $("#syncMsg");
  const linhas = [...document.querySelectorAll("#lista .item")].map(el => el.dataset.code);
  const visiveis = linhas.map(c => ITENS.find(i => i.code === c && i.loja === lojaAtual())).filter(Boolean);

  // PONTO MEDIO: o item arrastado recebe um numero entre os dois vizinhos
  // (entre 2 e 3 vira 2,5). Isso grava SO quem foi movido, e nao precisa
  // mexer em mais ninguem. So da para fazer assim porque a ordem agora vive
  // no InsumoPorUnidade / EstoquePorcionamentos, onde o campo aceita decimal
  // e nao exige valor unico -- em Insumos exigia, e por isso a v22 tinha de
  // estacionar os valores antes de entregar os definitivos.
  const mudou = [];
  visiveis.forEach((it, ix) => {
    if (!movidos.has(it.code)) return;
    const ant = visiveis[ix - 1], dep = visiveis[ix + 1];
    let novo;
    if (ant && dep)      novo = (ant.ordem + dep.ordem) / 2;
    else if (ant)        novo = ant.ordem + 1;
    else if (dep)        novo = dep.ordem - 1;
    else                 return;
    novo = Math.round(novo * 1000) / 1000;
    if (novo !== it.ordem){ it.ordem = novo; mudou.push(it); }
  });

  if (!mudou.length){ m.textContent = "A ordem não mudou."; movidos.clear(); return; }

  b.disabled = true; m.style.color = "var(--sub)"; m.textContent = "Salvando a ordem…";
  let ok = 0, falhou = 0; const ruins = [];
  for (let i = 0; i < mudou.length; i += 5){
    const r = await Promise.allSettled(mudou.slice(i, i + 5).map(x =>
      gravar(x.ordemLista, x.ordemId, { OrdemEstoque: x.ordem })));
    r.forEach((x, k) => { if (x.status === "fulfilled") ok++; else { falhou++; ruins.push(mudou[i + k].code); } });
    m.textContent = "Salvando a ordem… " + (ok + falhou) + "/" + mudou.length;
  }
  m.textContent = !falhou
    ? ("Ordem salva: " + ok + " item(ns) mudaram de lugar.")
    : ("Ordem salva em " + ok + ", com " + falhou + " falha(s) — refaça: " + ruins.join(", "));
  m.style.color = falhou ? "var(--verm)" : "var(--verde)";
  ordemSuja = !!falhou; movidos.clear(); b.disabled = false; pintarBotaoOrdem();
}

function setQtd(code, v){
  if (v === "" || v === null) delete estado[code]; else estado[code] = String(v);
  salvarEstado();
  const el = document.querySelector('.item[data-code="' + code + '"]');
  if (el) el.classList.toggle("filled", !!estado[code]);
  atualizarContador();
}

function atualizarContador(){
  const n = Object.keys(estado).length;
  $("#cont").textContent = n;
  $("#salvar").disabled = n === 0;
}

/* ----------------------------------------------------- eventos */
$("#app").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const item = b.closest(".item"), code = item.dataset.code;
  const inp = item.querySelector(".qty");
  const atual = parseFloat((inp.value + "").replace(",", ".")) || 0;
  const novo = b.dataset.act === "inc" ? atual + 1 : Math.max(0, atual - 1);
  inp.value = novo === 0 ? "" : novo;
  setQtd(code, inp.value);
});
$("#app").addEventListener("input", e => {
  if (!e.target.classList.contains("qty")) return;
  setQtd(e.target.closest(".item").dataset.code, e.target.value);
});
$("#tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (!t) return;
  abaAtual = t.dataset.almox;
  $$(".tab").forEach(x => x.classList.toggle("active", x === t));
  render();
});
$("#busca").addEventListener("input", render);
$("#tipo").addEventListener("change", e => {
  tipoAtual = e.target.value; abaAtual = null; $("#busca").value = "";
  montarTabs(); render();
});
$("#loja").addEventListener("change", () => {
  localStorage.setItem("contagem::ultimaLoja", $("#loja").value);
  carregarEstado(); montarTabs(); render();
});
$("#data").addEventListener("change", () => { carregarEstado(); render(); });

$("#salvar").addEventListener("click", () => {
  const linhas = Object.keys(estado).map(code => {
    const it = ITENS.find(i => i.code === code) || {};
    return { Item: code, Tipo: it.tipo === "insumo" ? "Insumo" : "Preparo",
             Quantidade: parseFloat(estado[code]), Unidade: it.unidade };
  });
  const semDestino = Object.keys(estado).filter(c => {
    const it = ITENS.find(i => i.code === c); return it && !gravavel(it);
  });
  const [a,m,d] = $("#data").value.split("-");
  $("#resumoEnvio").innerHTML =
    'Loja: <b style="color:var(--verde)">' + $("#loja").value + '</b>' +
    '<br>Data: <b>' + d + '/' + m + '/' + a + '</b> · <b>' + linhas.length + '</b> itens' +
    '<br>Gravando como: <b>' + ((conta && conta.username) || "—") + '</b>' +
    (semDestino.length ? '<br><span style="color:var(--verm);font-weight:600">⚠ ' + semDestino.length +
      ' sem cadastro de estoque — não serão gravados</span>' : '');
  $("#payload").textContent = JSON.stringify(
    { Loja: $("#loja").value, DataContagem: $("#data").value, Itens: linhas }, null, 2);
  $("#envioStatus").textContent = conta ? "" : "Entre com a conta da empresa para gravar.";
  $("#envioStatus").style.color = conta ? "var(--sub)" : "var(--verm)";
  $("#btnEnviar").disabled = !conta;
  $("#modal").classList.add("show");
});
$("#fechar").addEventListener("click", () => $("#modal").classList.remove("show"));

async function enviar(){
  const st = $("#envioStatus"), btn = $("#btnEnviar");
  const iso = new Date().toISOString();
  const tarefas = [], ignorados = [];
  Object.keys(estado).forEach(code => {
    const it = ITENS.find(i => i.code === code); if (!it) return;
    const id = destinoDe(it);
    if (!id){ ignorados.push(code); return; }
    const qtd = parseFloat((estado[code] + "").replace(",", ".")) || 0;
    tarefas.push(it.tipo === "insumo"
      ? { lista: "EstoqueInsumos",        id, campos: { EstoqueAtual: qtd, DataContagem: iso } }
      : { lista: "EstoquePorcionamentos", id, campos: { field_5: qtd } });
  });
  if (!tarefas.length){ st.textContent = "Nada para gravar."; st.style.color = "var(--sub)"; return; }

  btn.disabled = true;
  let ok = 0, falhou = 0;
  for (let i = 0; i < tarefas.length; i += 6){
    const r = await Promise.allSettled(tarefas.slice(i, i + 6)
      .map(t => gravar(t.lista, t.id, t.campos)));
    r.forEach(x => x.status === "fulfilled" ? ok++ : falhou++);
    st.textContent = "Gravando… " + (ok + falhou) + "/" + tarefas.length;
    st.style.color = "var(--sub)";
  }
  // "Gravado" de verdade: o PATCH do Graph só volta OK depois que o
  // SharePoint confirmou. Diferente do fluxo antigo, que respondia 202
  // antes de escrever.
  st.innerHTML = "✅ Gravados <b>" + ok + "</b> itens" +
    (falhou ? " · <b style='color:var(--verm)'>" + falhou + " falha(s)</b>" : "") +
    (ignorados.length
      ? "<div style='margin-top:8px;padding:8px 10px;border-radius:10px;background:#fdeaec;" +
        "border:1px solid var(--verm);color:var(--verm);font-size:13px;font-weight:600'>⚠ " +
        ignorados.length + " item(ns) sem cadastro de estoque:<br><span style='font-weight:400'>" +
        ignorados.join(", ") + "</span><br><span style='font-weight:400'>Anote no papel e avise o gestor.</span></div>"
      : "");
  st.style.color = "var(--verde)";
  if (ok && !falhou){
    estado = {}; salvarEstado(); render();
  }
  btn.disabled = false;
}
$("#btnEnviar").addEventListener("click", enviar);

$("#btnOrganizar").addEventListener("click", async () => {
  if (organizando && ordemSuja){ await salvarOrdem(); }
  organizando = !organizando;
  if (!organizando) $("#syncMsg").textContent = "Clique antes de começar a contagem.";
  else { $("#syncMsg").style.color = "var(--sub)";
         $("#syncMsg").textContent = "Arraste pelo ≡ para mudar a ordem."; }
  pintarBotaoOrdem();
  render();
});

$("#btnSync").addEventListener("click", async () => {
  const b = $("#btnSync"), m = $("#syncMsg");
  b.disabled = true; m.style.color = "var(--sub)"; m.textContent = "Lendo o cadastro…";
  try{ await carregar(); m.textContent = "Catálogo atualizado."; }
  catch(e){ m.textContent = ""; tratarFalhaDeCarga(e); }
  b.disabled = false;
});

/* ----------------------------------------------------- partida */
const hoje = new Date();
$("#data").value = hoje.getFullYear() + "-" +
  String(hoje.getMonth()+1).padStart(2,"0") + "-" + String(hoje.getDate()).padStart(2,"0");
const ultimaLoja = localStorage.getItem("contagem::ultimaLoja");
if (ultimaLoja) $("#loja").value = ultimaLoja;
carregarEstado();

(async function(){
  try{
    await iniciarAuth();
  }catch(e){
    $("#app").innerHTML = '<div class="loading" style="color:var(--verm)">Falha ao iniciar o login: ' + e.message + '</div>';
    return;
  }
  if (!conta){
    $("#app").innerHTML =
      '<div class="loading" style="padding:28px 16px">' +
      '<p style="margin:0 0 6px">Entre com a sua conta da Way Foods para contar.</p>' +
      '<p style="margin:0 0 14px;font-size:12px;color:var(--sub)">Use o endereço ' +
      '<b>@domrubi.com.br</b>. Se a Microsoft perguntar, escolha ' +
      '<b>Conta corporativa ou de estudante</b> — nunca a pessoal.</p>' +
      '<button class="btn" id="btnEntrar" style="padding:12px 22px">Entrar com a conta Microsoft</button>' +
      '<div style="margin-top:10px"><button id="btnSair" style="padding:8px 14px;border-radius:9px;' +
      'border:1px solid var(--borda);background:#fff;color:var(--sub);font-family:inherit;font-size:13px">' +
      'Sair da conta</button></div>' +
      (erroLogin ? '<div style="margin-top:16px;padding:10px 12px;border-radius:10px;background:#fdeaec;' +
        'border:1px solid var(--verm);color:var(--verm);font-size:13px;text-align:left">' + erroLogin + '</div>' : '') +
      '</div>';
    $("#btnEntrar").addEventListener("click", entrar);
    $("#btnSair").addEventListener("click", () => {
      // limpa o cache do MSAL deste aparelho e volta para a escolha de conta
      try{ Object.keys(localStorage).filter(k => /^(msal|\{")/.test(k)).forEach(k => localStorage.removeItem(k)); }catch(e){}
      try{ sessionStorage.clear(); }catch(e){}
      // logoutRedirect derruba tambem a sessao no login.microsoftonline.com,
      // que e onde a conta pessoal fica pendurada.
      msalApp.logoutRedirect({ postLogoutRedirectUri: location.origin + location.pathname });
    });
    return;
  }
  try{ await carregar(); }
  catch(e){ tratarFalhaDeCarga(e); }
})();
